name: Build Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: New release tag (vMAJOR.MINOR.PATCH); project version will be updated
        required: true
        type: string
permissions:
  contents: read
jobs:
  build-deb:
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - name: Validate tag
        id: meta
        env:
          INPUT_TAG: ${{ inputs.tag }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          if [[ "$EVENT_NAME" == workflow_dispatch ]]; then tag="$INPUT_TAG"; fi
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'Invalid release tag'; exit 1; }
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || format('refs/tags/{0}', steps.meta.outputs.tag) }}
      - name: Set version for manual release
        if: github.event_name == 'workflow_dispatch'
        env:
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != refs/heads/main ]]; then
            echo '::error::Manual releases must run on main.'; exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
            echo "::error::Tag $TAG already exists; choose a new version."; exit 1
          fi
          sed -i -E "s/^( *VERSION )[0-9]+\.[0-9]+\.[0-9]+/\1${TAG#v}/" CMakeLists.txt
      - name: Verify version
        env:
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          version=$(sed -nE 's/^ *VERSION ([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' CMakeLists.txt | head -1)
          test "$version" = "${TAG#v}"
      - uses: ./.github/actions/package
      - uses: actions/upload-artifact@v4
        with:
          name: release-deb
          path: |
            build/packages/*.deb
            build/packages/SHA256SUMS
          if-no-files-found: error
  release:
    needs: build-deb
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - name: Checkout tested source
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Commit version and create tag
        if: github.event_name == 'workflow_dispatch'
        env:
          TAG: ${{ needs.build-deb.outputs.tag }}
          TESTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TESTED_SHA" || { echo '::error::main changed during the build; run again.'; exit 1; }
          sed -i -E "s/^( *VERSION )[0-9]+\.[0-9]+\.[0-9]+/\1${TAG#v}/" CMakeLists.txt
          version=$(sed -nE 's/^ *VERSION ([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' CMakeLists.txt | head -1)
          test "$version" = "${TAG#v}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if ! git diff --quiet -- CMakeLists.txt; then
            git add CMakeLists.txt
            git commit -m "chore(release): $TAG"
          fi
          git tag "$TAG"
          git push --atomic origin HEAD:refs/heads/main "refs/tags/$TAG"
      - uses: actions/download-artifact@v4
        with:
          name: release-deb
          path: release-assets
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build-deb.outputs.tag }}
          generate_release_notes: true
          body: |
            Experimental demo only; not connected to Zalo. Unofficial and not affiliated with VNG.
            This package targets Ubuntu 26.04 amd64; verify SHA256SUMS before installation.
          files: |
            release-assets/*.deb
            release-assets/SHA256SUMS
