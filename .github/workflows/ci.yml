name: Native build and offline tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        sanitizers: ['OFF', 'ON']
    steps:
      - uses: actions/checkout@v4
      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgl1-mesa-dev libxkbcommon-dev libxcb-cursor0
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          cache: true
      - name: Configure
        run: >-
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug
          -DZALO_WEBENGINE=OFF -DZALO_ENABLE_SANITIZERS=${{ matrix.sanitizers }}
      - run: cmake --build build --parallel 2
      - name: Test offline
        env:
          QT_QPA_PLATFORM: offscreen
          ASAN_OPTIONS: detect_leaks=0
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: ctest --test-dir build --output-on-failure
      - name: Stage install
        if: matrix.sanitizers == 'OFF'
        run: cmake --install build --prefix "$PWD/stage"
      - uses: actions/upload-artifact@v4
        if: matrix.sanitizers == 'OFF'
        with:
          name: zalo-native-qt-sdk-build
          path: stage/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-logs-${{ matrix.sanitizers }}
          path: build/Testing/Temporary/LastTest.log
          if-no-files-found: ignore
